name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Format check
        working-directory: frontend
        run: npm run format:check

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Format check
        working-directory: backend
        run: npm run format:check

      - name: Type check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Test
        working-directory: backend
        run: npm test

      - name: Firestore emulator tests
        working-directory: backend
        run: npm run test:db

      - name: Build
        working-directory: backend
        run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Type check
        working-directory: e2e
        run: npx tsc --noEmit

      - name: Run E2E tests
        working-directory: e2e
        run: npm test

      - name: Check e2e servers stopped
        working-directory: e2e
        run: npm run test:servers-stopped

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  pins:
    name: Node pins
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Node version pins
        run: scripts/check-node-pins.sh

  image-verify:
    name: Image verify (backend, throwaway)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t pigeon-backend:ci backend

      - name: Scan backend image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 pigeon-backend:ci

      - name: Smoke test backend image
        if: ${{ !cancelled() }}
        run: |
          docker run -d --name smoke -p 8080:8080 -e FIREBASE_PROJECT_ID=demo-pigeon-e2e pigeon-backend:ci
          body=""
          for i in $(seq 1 30); do
            if body="$(curl -fsS localhost:8080/health)"; then break; fi
            sleep 1
          done
          echo "health: $body"
          docker logs smoke
          test "$body" = '{"ok":true}'
          docker run --rm --entrypoint sh pigeon-backend:ci -c 'test ! -e /usr/local/lib/node_modules/npm && test ! -e /usr/local/bin/npx && test ! -e /usr/local/lib/node_modules/corepack'
          echo "npm, npx and corepack absent"
