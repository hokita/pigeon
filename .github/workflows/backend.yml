name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  PROJECT_ID: pigeon-d6e3b8
  REGION: asia-northeast1
  IMAGE: asia-northeast1-docker.pkg.dev/pigeon-d6e3b8/pigeon/backend

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Test
        working-directory: backend
        run: npm test

      - name: Build
        working-directory: backend
        run: npm run build

      - uses: google-github-actions/auth@v3
        with:
          project_id: pigeon-d6e3b8
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGE }}:latest

      - name: Deploy
        env:
          MCP_TOKEN_SECRET: ${{ vars.PIGEON_MCP_TOKEN_SECRET }}
        run: |
          secrets="ALLOWED_EMAILS=ALLOWED_EMAILS:latest"
          if [ -n "$MCP_TOKEN_SECRET" ]; then
            secrets="$secrets,PIGEON_MCP_TOKEN=$MCP_TOKEN_SECRET:latest"
          fi
          gcloud run deploy pigeon-backend --region "$REGION" --project "$PROJECT_ID" \
            --image "$IMAGE:latest" \
            --allow-unauthenticated --min-instances 0 --max-instances 2 \
            --set-env-vars "NODE_ENV=production,FIREBASE_PROJECT_ID=$PROJECT_ID,FRONTEND_URL=https://$PROJECT_ID.web.app" \
            --set-secrets "$secrets"
